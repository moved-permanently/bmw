name: Deploy bmw-proxy
on:
  push:
    branches: [main]
    paths:
      - 'tools/workers/bmw-proxy/**'
      - '.github/workflows/deploy-bmw-proxy.yaml'
  workflow_dispatch:

concurrency:
  group: deploy-bmw-proxy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/workers/bmw-proxy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ac7ee4615628005dc5ba0a22f0aae2a6
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v6
      with:
        node-version: 24
    - run: node --test
    - name: Check Cloudflare credentials
      run: |
        if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
          echo "::error::Repository secret CLOUDFLARE_API_TOKEN is not set. It needs Workers Scripts:Edit on the Blackbird account."
          exit 1
        fi
    - run: npx -y wrangler@4 deploy
