<!DOCTYPE html>
<html lang="en">
  <head>
    <title>BMW icons</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../spectrum.css">
    <link rel="stylesheet" href="../aida-plugin.css">
    <link rel="stylesheet" href="./icon-picker.css">
    <script src="./icon-picker.js" type="module"></script>
  </head>
  <body class="spectrum spectrum--medium spectrum--light">
    <main class="aida-plugin icon-picker">
      <h1>BMW icons</h1>
      <p class="aida-muted">Inserts the icon name between colons. Blocks with icon support show it as the BMW icon.</p>
      <label class="spectrum-FieldLabel spectrum-FieldLabel--sizeM" for="icon-search">Search icons</label>
      <div class="spectrum-Textfield spectrum-Textfield--sizeM icon-search">
        <input id="icon-search" class="spectrum-Textfield-input" type="search" autocomplete="off" spellcheck="false" placeholder="e.g. arrow right, charging">
      </div>
      <p id="icon-count" class="aida-muted" role="status" aria-live="polite">Loading icons…</p>
      <ul id="icon-grid" class="icon-grid"></ul>
    </main>
  </body>
</html>
